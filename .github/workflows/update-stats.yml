name: Update profile statistics

on:
  workflow_dispatch:
  schedule:
    - cron: '23 7 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/update_stats.py'
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Read public GitHub statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROFILE_OWNER: 0ry0n
        run: python scripts/update_stats.py
      - name: Commit updated statistics
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: refresh public profile statistics'
          git push origin HEAD:main
