  <title id="title">0ry0n — Giuseppe Silvestro</title>
  <desc id="desc">A compact terminal window with the whoami command, 0ry0n and a small Orion star field. Exploring systems. Occasionally breaking them.</desc>
  <!-- Orion: gnomonic projection centred on RA 84 deg, Dec -1 deg; north up, east left.
